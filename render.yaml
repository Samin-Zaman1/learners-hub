services:
  - type: web
    name: champius-api
    env: node
    region: oregon
    plan: starter
    buildCommand: cd apps/api && npm install && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: champius-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://your-app.vercel.app
      - key: PORT
        value: 4000

databases:
  - name: champius-db
    databaseName: champius
    plan: starter
