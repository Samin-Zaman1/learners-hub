services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: champius
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches outgoing email in development: set SMTP_HOST=localhost, SMTP_PORT=1025
  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025", "1025:1025"]  # open http://localhost:8025

volumes:
  pgdata:
